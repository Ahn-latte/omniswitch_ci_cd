id: TC-AU-841
name: Audit data access restriction (low-privilege account)
description: 인가된 관리자만 감사데이터 접근 가능 확인 (8.4.1). 반드시 저권한 계정 device로 실행 - secureadmin으로 돌리면 통과해버려 무의미.
feature: system
tags: [secfunc, audit, required, lowpriv]
severity: high
setup: []
validations:
  - name: 감사로그 열람 차단
    type: contains
    command: show log swlog
    expected: "ERROR: Authorization failed"
  # 삭제와 복사는 거부 경로가 서로 다름 - swlog clear 는 기능 권한 자체가 없어서
  # "ERROR: Authorization failed. No functional privileges for this command." 로,
  # cp 는 파일 명령이라 secureadmin 게이트에서 "allowed only for secureadmin" 으로
  # 막힘. 이 시험의 요점은 문구가 아니라 차단되었다는 사실이므로 둘 다 수용함
  # (문구를 하나로 고정하면 펌웨어 표현이 바뀔 때 정책과 무관하게 깨짐).
  - name: 감사로그 삭제 차단
    type: regex
    command: swlog clear all
    pattern: 'ERROR: Authorization failed|allowed only for secureadmin'
  - name: 감사로그 복사 차단
    type: contains
    command: cp swlog_chassis1
    expected: "This command is allowed only for secureadmin"
cleanup: []
continue_on_failure: true
timeout: 60
