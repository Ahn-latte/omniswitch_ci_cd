id: TC-AU-841
name: Audit data access restriction (low-privilege account)
description: 인가된 관리자만 감사데이터 접근 가능 확인 (8.4.1). 반드시 저권한 계정 device로 실행 - secureadmin으로 돌리면 통과해버려 무의미.
feature: system
tags: [secfunc, audit, required, lowpriv]
severity: high
setup: []
validations:
  - name: 감사로그 열람 차단
    type: contains
    command: show log swlog
    expected: "ERROR: Authorization failed"
  # 삭제(swlog clear)와 복사(cp) 모두 secureadmin 전용 안내로 거부되어야 함.
  # 참고: 이 스위치의 현재 펌웨어는 삭제에 대해 일반 권한 에러
  # ("ERROR: Authorization failed. No functional privileges for this command.")
  # 를 돌려줌 - 차단은 되지만 안내 문구가 복사 쪽과 다름. 여기서는 의도된 문구를
  # 기대하므로, 그 차이는 이 검증의 실패로 드러남.
  - name: 감사로그 삭제 차단
    type: contains
    command: swlog clear all
    expected: "ERROR: This command is allowed only for secureadmin"
  - name: 감사로그 복사 차단
    type: contains
    command: cp swlog_chassis1
    expected: "This command is allowed only for secureadmin"
cleanup: []
continue_on_failure: true
timeout: 60
