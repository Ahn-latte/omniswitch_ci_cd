id: TC-IA-121
name: Secure password policy enforcement
description: 비밀번호 보안성 기준 설정/조회 기능 확인 (보안적합성 1.2.1)
feature: system
tags: [secfunc, ia, required]
severity: high
setup:
  - action: cli
    commands:
      - user password-size min 9
validations:
  - name: 비밀번호 정책 조회
    type: contains
    command: show user password-policy
    expected: "Password Policy:"
  - name: 최소 길이 반영
    type: regex
    command: show user password-policy
    pattern: 'Minimum size\s*:\s*9'
cleanup:
  - action: cli
    commands:
      - user password-size min 8
continue_on_failure: false
timeout: 60
