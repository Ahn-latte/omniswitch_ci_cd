id: TC-AU-811
name: Audit data generation
description: 인증 성공/실패, 펌웨어 업데이트, 무결성 검사, 서비스 활성화/비활성화 감사 데이터 생성 확인 (8.1.1)
feature: system
tags: [secfunc, audit, required, secureadmin, console]
severity: high
setup:
  # radius 를 쓰는 이유: ntp 는 TC-AU-831 이 한 실행에서 최대 97회, 다른
  # testcase 들도 반복 토글하는 가장 혼잡한 서비스라, grep 을 아무리 좁혀도
  # 이 세션 동안 쌓인 과거 실행분과 계속 부딪힘. radius 는 다른 어떤
  # testcase 도 admin-state 를 토글하지 않으므로, 이 시험이 방금 낸 두 줄만
  # 존재함이 세션 이력과 무관하게 보장됨.
  - action: cli
    commands:
      - ip service radius admin-state disable
      - ip service radius admin-state enable
validations:
  - name: 인증 성공 기록
    type: regex
    command: 'show log swlog | grep -i "Login by"'
    pattern: '(?i)login.*success'
    timeout: 90
    reauth: true
  - name: 인증 실패 기록
    type: regex
    command: 'show log swlog | grep -i "Login by"'
    pattern: '(?i)login.*fail'
    timeout: 90
    reauth: true
  # 알려진 펌웨어 버그: 이 스위치는 업그레이드/다운그레이드를 실제로 수행해도
  # "AOS upgrade or downgrade complete" 를 감사데이터에 남기지 않음. 그래서 이
  # 검증은 현재 펌웨어에서 항상 실패하며, 그 실패가 곧 발견 사항임 - 테스트를
  # 고쳐서 통과시킬 것이 아니라 그대로 두어 미충족으로 보고할 것.
  # (그 때문에 이 testcase 는 continue_on_failure: true 이며, 나머지 네 검증은
  #  정상적으로 통과함.)
  - name: 펌웨어 업데이트 기록
    type: contains
    command: show log swlog | grep -i upgra
    expected: "AOS upgrade or downgrade complete"
    timeout: 90
    reauth: true
  - name: 무결성 검사 기록
    type: contains
    command: show log swlog | grep -i integrity
    expected: "integrity check successful"
    timeout: 90
    reauth: true
  - name: 서비스 활성화/비활성화 기록
    type: regex
    command: 'show log swlog | grep -i "ip service radius"'
    pattern: 'cmd: ip service radius admin-state (enable|disable), result: SUCCESS'
    timeout: 90
    reauth: true
cleanup:
  # The setup's disable/enable pair is self-cancelling only if both halves
  # run. This makes the end state true regardless.
  - action: cli
    commands:
      - ip service radius admin-state enable
continue_on_failure: true
timeout: 180
