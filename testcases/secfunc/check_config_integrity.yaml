id: TC-ST-523
name: Config file integrity check on backup/restore
description: 설정 백업(write memory) 및 복원 시 설정 파일 무결성 검사 수행 확인 (5.2.3). 재부팅 후 로그 확인은 수동 병행.
feature: system
tags: [secfunc, selftest, optional, boot]
severity: medium
setup:
  - action: save_config
validations:
  - name: 설정 파일 무결성 검사 성공 로그
    type: contains
    command: show log swlog | grep -i "config integrity"
    expected: "AOS config integrity check successful"
cleanup: []
continue_on_failure: false
timeout: 120
