id: TC-SM-442
name: Firmware hash verification
description: 펌웨어 해시값 비교 검증 (4.4.2). /flash/working에 imgsha256sum 필요.
feature: system
tags: [secfunc, mgmt, required, slow]
severity: high
setup: []
validations:
