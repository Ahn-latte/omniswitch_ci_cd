validations:
  - name: 임계치 반영 (최저 한도 50%)
    type: regex
    command: show swlog
    pattern: 'Swlog Threshold\s*:\s*50 percent'
  # 이 시험의 핵심. 로그 파일이 가득 차면 스위치가 예전 항목을 덮어쓰며 그 사실을
  # 감사데이터에 남김:
  #   Switch log file reached 100%, overwritten !!!
  # 퍼센트 숫자는 하드코딩하지 않음(펌웨어/설정에 따라 달라질 수 있음).
  - name: 로그 파일이 가득 차 오버라이팅됨
    type: regex
    command: show log swlog | grep -i "overwri"
    pattern: '(?i)log file reached\s+\d+%\s*,\s*overwritten'
    timeout: 90
    reauth: true
cleanup:
  - action: cli
    commands:
      - swlog output flash-file-size $baseline_swlog_flash_file_size
      - swlog size-trap-threshold $baseline_swlog_size_trap_threshold
      # The debug3 override the setup installs floods the log for every
      # later testcase if it is left behind.
      - swlog appid intfni subapp all level $baseline_swlog_appid_level
      # setup 의 반복 구간이 NTP를 꺼둔 채로 끝나므로 여기서 되돌림.
      - ip service ntp admin-state enable
continue_on_failure: false
timeout: 180
