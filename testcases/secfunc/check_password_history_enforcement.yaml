id: TC-IA-124
name: Password history prevents reuse of a recent password
description: >-
  비밀번호 이력 기능(user password-history) 검증. history 값이 3인 상태에서, 지금과
  똑같은 비밀번호로의 변경 시도가 거부되는지 확인. (1.2.x)

  정책 위반을 보는 TC-IA-122/123과 달리, 여기서는 "정책은 통과하지만 최근에 쓴 값"을 거부하는
  이력 규칙만 단독으로 봄.

  실제로는 비밀번호를 바꾸지 않음 -- 재사용 시도는 거부되는 것이 곧 성공 조건이라 그 자체로
  아무 상태도 바뀌지 않고, 따라서 실제 변경 후 되돌리는 절차도 필요 없음. 대상은
  admin($admin_user) 본인 계정이며, 전제는 그 계정의 현재 비밀번호가 $test_password 라고
  가정함(재사용 거부 케이스가 그 값으로 변경을 시도하기 때문). lab.yaml 의 admin 계정
  비밀번호가 $test_password 와 다르면 이 시험만 --tag 로 제외하거나 값을 맞출 것.

  password-history 는 계정별이 아니라 전역 설정이라, setup에서 baseline 값으로 고정해
  이전 실행이 남긴 값과 무관하게 이력 규칙이 실제로 걸리는지 확인함(이 자체는 상태를
  파괴적으로 바꾸지 않으므로 별도 cleanup이 필요 없음).

  반드시 --device secureadmin 으로 실행. secureadmin 이 admin 계정을 대상으로 명령을 낼
  권한이 있음.
feature: system
tags: [secfunc, ia, required, secureadmin, console]
severity: high
setup:
  # Pin history to the baseline so the reuse below is genuinely blocked by the
  # history rule regardless of what a previous run left configured. Harmless
  # to (re)apply: it never differs from what's already there in a clean run.
  - action: cli
    commands:
      - user password-history $baseline_password_history
validations:
  # Runs while the password is still $test_password, so this is a reuse of the
  # current value -- refused by the history rule. Rejection is the pass
  # condition, so nothing about the account actually changes.
  - name: 최근 비밀번호 재사용 차단 (history=3)
    type: contains
    command: user $admin_user password $test_password
    expected: "New password can not be the same as your current password or any of your previous 3 passwords"
continue_on_failure: false
timeout: 60
