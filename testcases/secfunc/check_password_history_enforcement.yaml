id: TC-IA-124
name: Password history prevents reuse of a recent password
description: >-
  비밀번호 이력 기능(user password-history) 검증. history 값이 3인 상태에서 (1) 지금과
  똑같은 비밀번호로의 변경은 거부되고 (2) 정책을 만족하는 새 비밀번호로의 변경은 성공하는지
  확인. (1.2.x)

  정책 위반을 보는 TC-IA-122/123과 달리, 여기서는 "정책은 통과하지만 최근에 쓴 값"을 거부하는
  이력 규칙만 단독으로 봄.

  대상은 admin($admin_user) 본인 계정이며, 성공 케이스는 실제로 비밀번호를 Qet135!#% 로 바꿈.
  cleanup이 원래대로 되돌리는데, 그 순서가 중요함:
    1. user password-history 0   - 방금 바꾸면서 이력에 들어간 원래 비밀번호를 다시 쓸 수
                                    있게 이력 검사를 잠시 끔
    2. user $admin_user password $test_password   - 원래 비밀번호로 복구
    3. user password-history $baseline_password_history   - 이력 검사를 baseline(3)으로 복원

  전제: 이 시험은 admin 계정의 현재 비밀번호가 $test_password 라고 가정함(재사용 거부 케이스가
  그 값으로 변경을 시도하기 때문). lab.yaml 의 admin 계정 비밀번호가 $test_password 와 다르면
  이 시험만 --tag 로 제외하거나 값을 맞출 것. 그 가정 때문에 반드시 콘솔(secureadmin)로 실행함 -
  만약 복구가 실패해도 대역 외 콘솔로 admin 비밀번호를 되돌릴 수 있음.

  반드시 --device secureadmin 으로 실행. secureadmin 이 admin 계정의 비밀번호를 바꿀 권한이 있고,
  password-history 는 계정별이 아니라 전역 설정이라 조작 후 반드시 원복해야 함.
feature: system
tags: [secfunc, ia, required, secureadmin, console]
severity: high
setup:
  # Pin history to the baseline so the reuse below is genuinely blocked by the
  # history rule regardless of what a previous run left configured.
  - action: cli
    commands:
      - user password-history $baseline_password_history
validations:
  # Runs while the password is still $test_password, so this is a reuse of the
  # current value -- refused by the history rule.
  - name: 최근 비밀번호 재사용 차단 (history=3)
    type: contains
    command: user $admin_user password $test_password
    expected: "New password can not be the same as your current password or any of your previous 3 passwords"
  # A policy-clean, not-recently-used value: this one actually changes the
  # password, which the cleanup then reverts.
  - name: 정책을 만족하는 새 비밀번호로 변경 성공
    type: not_contains
    command: user $admin_user password Qet135!#%
    expected: "ERROR"
cleanup:
  - action: cli
    commands:
      - user password-history 0
      - user $admin_user password $test_password
      - user password-history $baseline_password_history
continue_on_failure: false
timeout: 90
