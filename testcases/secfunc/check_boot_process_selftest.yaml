id: TC-ST-512
name: Process self-test at boot
description: 장비 구동 시 주요 프로세스(AAA/Config Manager/Network/QoS/VLAN/L2/L3) 자체검사 수행 확인 (5.1.2)
feature: system
tags: [secfunc, selftest, required, boot]
severity: high
setup: []
validations:
  - name: Chassis Supervision 프로세스 Ok
    type: regex
    command: show log swlog | grep -i "Chassis Supervision Process"
    pattern: 'Chassis Supervision Process\s*-+>\s*(?i:ok)'
    timeout: 90
    reauth: true
  - name: AAA 프로세스 Ok
    type: regex
    command: show log swlog | grep -i "AAA Process"
    pattern: 'AAA Process\s*-+>\s*(?i:ok)'
    timeout: 90
    reauth: true
  - name: Configuration Manager 프로세스 Ok
    type: regex
    command: show log swlog | grep -i "Configuration Manager Process"
    pattern: 'Configuration Manager Process\s*-+>\s*(?i:ok)'
    timeout: 90
    reauth: true
  - name: VLAN Manager 프로세스 Ok
    type: regex
    command: show log swlog | grep -i "VLAN Manager Process"
    pattern: 'VLAN Manager Process\s*-+>\s*(?i:ok)'
    timeout: 90
    reauth: true
cleanup: []
continue_on_failure: false
timeout: 120
