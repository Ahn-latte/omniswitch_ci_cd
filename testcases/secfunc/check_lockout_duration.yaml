id: TC-IA-132
name: Configurable lockout duration
description: 인증 실패 시 접속 제한 시간 설정 기능 (1.3.2)
feature: system
tags: [secfunc, ia, optional]
severity: medium
setup:
  - action: cli
    commands:
      - user lockout-duration 5
validations:
  - name: 잠금 시간 5분 반영
    type: regex
    command: show user lockout-setting
    pattern: 'Duration:\s*5\s*\(minutes\)'
cleanup:
  # Without this the switch keeps the 5-minute duration this testcase set,
  # which is the value under test, not the value the lab runs with.
  - action: cli
    commands:
      - user lockout-duration $baseline_lockout_duration
continue_on_failure: false
timeout: 60
