id: TC-IA-123
name: Password policy enforcement on existing account password change
description: >-
  비밀번호 정책(길이/조합규칙/연속문자/계정명 포함/과거 비밀번호) 위반 시 이미 존재하는 계정의
  비밀번호 변경이 차단되는지 확인. 신규 생성을 보는 TC-IA-122와 달리 "변경" 경로를 봄. (1.2.3)

  대상은 이 시험이 직접 만들고 지우는 임시 계정(tcpol)임. 예전에는 secureadmin을 직접 대상으로
  삼았는데, 그 방식은 위험했음 - 마지막 "과거 비밀번호 차단" 검증이 secureadmin의 현재 비밀번호를
  리터럴로 적어야 하고, 그 값이 실제와 다르면 스위치가 명령을 거부하는 대신 *성공시켜서*
  secureadmin의 비밀번호를 저장소에 적힌 값으로 바꿔버림. 임시 계정이면 현재 비밀번호를
  이 시험이 스스로 정하므로($test_password) 그런 결합이 사라지고, 실패해도 진짜 계정은 무사함.

  계정명 포함 검증이 tcpol 을 쓰는 이유: 숫자나 연속 문자가 없는 이름이어야 "계정명 포함" 규칙만
  단독으로 걸림 - 이름에 123 같은 게 들어가면 연속 문자 규칙이 먼저 걸려 무엇을 검증한 건지
  알 수 없게 됨.

  주의: 길이 미달 검증이 "at least 9 characters" 를 기대하므로 스위치의 user password-size min
  이 9여야 함. lab.yaml 의 baseline.password_size_min 이 그 값이며, TC-IA-121이 시험 후
  되돌리는 값이기도 함.
feature: system
tags: [secfunc, ia, required]
severity: high
setup:
  # Deleting an account that isn't there is an error, so the pre-clean step
  # tolerates errors and the creation step does not.
  - action: cli
    ignore_errors: true
    commands:
      - no user tcpol
  - action: cli
    commands:
      - user tcpol password $test_password read-only all
validations:
  - name: 길이 미달(8자) 차단
    type: contains
    command: user tcpol password 12#qweA
    expected: "ERROR: Password must contain at least 9 characters"
  - name: 특수문자 누락 차단
    type: contains
    command: user tcpol password 123qweASD
    expected: "ERROR: Password must contain at least 1 non-alphanumeric(s)."
  - name: 대문자 누락 차단
    type: contains
    command: user tcpol password 12#qweasd
    expected: "ERROR: Password must contain at least 1 English uppercase character(s)."
  - name: 소문자 누락 차단
    type: contains
    command: user tcpol password 12#QWEASD
    expected: "ERROR: Password must contain at least 1 English lowercase character(s)."
  - name: 숫자 누락 차단
    type: contains
    command: user tcpol password Qet++-ASD
    expected: "ERROR: Password must contain at least 1 base-10 digit(s)."
  - name: 정방향 연속 문자(qwer) 차단
    type: contains
    command: user tcpol password 12#qwerASD
    expected: "ERROR: Password should not contain consecutive characters (qwer)."
  - name: 역방향 연속 문자(poiu) 차단
    type: contains
    command: user tcpol password 12#poiuASD
    expected: "ERROR: Password should not contain consecutive characters (poiu)."
  - name: 정방향 연속 숫자(1234) 차단
    type: contains
    command: user tcpol password 1234%qweASD
    expected: "ERROR: Password should not contain consecutive characters (1234)."
  - name: 역방향 연속 숫자(0987) 차단
    type: contains
    command: user tcpol password 0987^qweASD
    expected: "ERROR: Password should not contain consecutive characters (0987)."
  - name: 동일 문자 3회 연속 차단
    type: contains
    command: user tcpol password 12#qqqASD
    expected: "ERROR: Password should not contain three or more consecutive identical characters."
  - name: 계정명(tcpol) 포함 차단
    type: contains
    command: user tcpol password 12#tcpolA
    expected: "ERROR: Password should not contain user's name."
  # The one check that needs to know the account's current password -- which is
  # exactly why the account is one this testcase created.
  - name: 과거 비밀번호 차단
    type: contains
    command: user tcpol password $test_password
    expected: "ERROR: New password can not be the same as your current password or any of your previous 3 passwords"
  - name: 차단 후에도 계정은 그대로 존재
    type: contains
    command: show user
    expected: "tcpol"
cleanup:
  - action: cli
    commands:
      - no user tcpol
continue_on_failure: true
timeout: 60
