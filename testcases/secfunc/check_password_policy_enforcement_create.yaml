id: TC-IA-122
name: Password policy enforcement on new account creation
description: >-
  비밀번호 정책(길이/조합규칙/연속문자) 위반 시 신규 계정 생성 차단 확인 (1.2.2)

  시험용 비밀번호에 '!' 를 쓰지 말 것. AOS CLI는 '!' 를 셸과 같은 history expansion 으로
  해석해서, 명령이 비밀번호 검사기에 닿기도 전에 "bash: !@: event not found" 로 죽음 -
  그러면 정책이 아니라 파서를 시험한 꼴이 됨. 아래 값들은 TC-IA-123 이 같은 스위치에서
  통과시킨 특수문자(#, %, ^, +, -)만 사용함.
feature: system
tags: [secfunc, ia, required]
severity: high
setup: []
validations:
  - name: 길이 미달(8자) 차단
    type: contains
    command: user tc122 password 12#qweA read-write all
    expected: "ERROR: Password must contain at least 9 characters"
  - name: 소문자 누락 차단
    type: contains
    command: user tc122 password 12#QWEASD read-write all
    expected: "ERROR: Password must contain at least 1 English lowercase character(s)."
  - name: 대문자 누락 차단
    type: contains
    command: user tc122 password 12#qweasd read-write all
    expected: "ERROR: Password must contain at least 1 English uppercase character(s)."
  - name: 숫자 누락 차단
    type: contains
    command: user tc122 password Qet++-ASD read-write all
    expected: "ERROR: Password must contain at least 1 base-10 digit(s)."
  - name: 특수문자 누락 차단
    type: contains
    command: user tc122 password 123qweASD read-write all
    expected: "ERROR: Password must contain at least 1 non-alphanumeric(s)."
  - name: 동일 문자 3회 연속 차단
    type: contains
    command: user tc122 password 12#qqqASD read-write all
    expected: "ERROR: Password should not contain three or more consecutive identical characters."
  - name: 정방향 연속 문자(qwer) 차단
    type: contains
    command: user tc122 password 12#qwerASD read-write all
    expected: "ERROR: Password should not contain consecutive characters (qwer)."
  - name: 역방향 연속 문자(poiu) 차단
    type: contains
    command: user tc122 password 12#poiuASD read-write all
    expected: "ERROR: Password should not contain consecutive characters (poiu)."
  - name: 정방향 연속 숫자(1234) 차단
    type: contains
    command: user tc122 password 1234%qweASD read-write all
    expected: "ERROR: Password should not contain consecutive characters (1234)."
  - name: 역방향 연속 숫자(0987) 차단
    type: contains
    command: user tc122 password 0987^qweASD read-write all
    expected: "ERROR: Password should not contain consecutive characters (0987)."
  - name: 차단으로 계정 미생성 확인
    type: not_contains
    command: show user
    expected: "tc122"
cleanup:
  # Every command above is supposed to be refused, so there should be no
  # account to remove. This is here for the case where one is not refused:
  # that is a finding, and it must not also leave a live account behind.
  - action: cli
    ignore_errors: true
    commands:
      - no user tc122
continue_on_failure: true
timeout: 60
