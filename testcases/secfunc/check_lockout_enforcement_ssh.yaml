id: TC-IA-133
name: SSH lockout actually triggers after 3 failed attempts
description: >-
  admin1 계정으로 SSH 접속 시 잘못된 비밀번호 3회 입력 후 실제로 계정이 잠기는지(secureadmin 세션으로
  show user admin1 확인)와 감사로그(show log swlog)에 기록되는지 확인. 잠금 임계값/시간 "설정값"만
  확인하는 TC-IA-131/TC-IA-132와 달리, 잠금이 실제로 동작하는지(behavioral) 검증. 시험 종료 후 admin1
  계정 잠금 해제. 반드시 --device secureadmin 으로 실행할 것 - ACSSW01(admin1)로 돌리면 접속에 쓰는
  계정을 스스로 잠그는 모순이 되고, swlog 열람도 secureadmin 권한이 필요함. secureadmin 세션 자체는
  시리얼 콘솔로 붙지만(같은 스위트의 TC-IA-134가 IP 차단을 유발하기 때문), 이 시험의 실패 로그인은
  SSH로 나가므로 검증 대상은 동일함.

  IP 단위 잠금 임계값(aaa switch-access ip-lockout-threshold)을 setup에서 15로 올렸다가
  cleanup에서 6으로 복구함 - 이 시험 자신의 admin1 실패 3회가 계정과 무관한 IP 단위 카운터에도
  잡혀서, 다른 트랜스포트(API/WebView) 시험과 무관하게 이 시험 단독으로도 IP 잠금을 유발할 수 있기
  때문. (omniswitch_api_poc의 API/WebView 대응 시험도 각자 동일하게 자체적으로 15/6을 관리함 -
  세 시험이 서로의 순서에 의존하지 않도록 독립적으로 자기 완결적임.)
feature: system
tags: [secfunc, ia, audit, required, secureadmin]
severity: high
setup:
  # IP-address-level, not per-account -- raised so this test's own 3 failed
  # admin1 logins can't trip an IP-level lockout on top of the account-level
  # one under test. Restored in cleanup.
  - action: cli
    commands:
      - aaa switch-access ip-lockout-threshold 15
  # Start from a known-unlocked state: a previous run that died before its
  # cleanup would otherwise leave admin1 locked, and this test would then
  # "pass" on the leftover lockout without proving anything.
  - action: ensure_unlocked
    username: admin1
  - action: trigger_failed_logins
    username: admin1
    wrong_password: "definitely-wrong-Passw0rd!1"
    attempts: 3
validations:
  - name: 계정 잠금 상태 반영 (show user admin1)
    type: regex
    command: show user admin1
    pattern: 'Account lockout\s*=\s*Yes'
  - name: 감사로그에 잠금 기록
    type: regex
    command: show log swlog | grep -i lockout
    pattern: 'User admin1 lockout during login attempt'
    timeout: 90
    reauth: true
cleanup:
  - action: cli
    commands:
      - aaa switch-access ip-lockout-threshold 6
  - action: ensure_unlocked
    username: admin1
continue_on_failure: false
timeout: 180
