id: TC-ST-511
name: Hardware self-test at boot
description: 장비 구동 시 주요 하드웨어(CPU/메모리/플래시/NI/전원) 자체검사 수행 확인 (5.1.1). 부팅 로그를 swlog에서 사후 조회.
feature: system
tags: [secfunc, selftest, required, boot, secureadmin, console]
severity: high
setup: []
validations:
  - name: 부팅 시 SSAPP 자체검사 로그 존재
    type: contains
    command: show log swlog | grep -i ssapp
    expected: "SSAPP"
    timeout: 90
    reauth: true
  - name: CPU 점검 결과 Ok
    type: regex
    command: show log swlog | grep -i "CPU Status"
    pattern: 'CPU Status\s*-+>\s*(?i:ok)'
    timeout: 90
    reauth: true
  - name: 메모리 점검 결과 Ok
    type: regex
    command: show log swlog | grep -i "Memory Status"
    pattern: 'Memory Status\s*-+>\s*(?i:ok)'
    timeout: 90
    reauth: true
  - name: 플래시 점검 결과 Ok
    type: regex
    command: show log swlog | grep -i "Flash Status"
    pattern: 'Flash Status\s*-+>\s*(?i:ok)'
    timeout: 90
    reauth: true
  - name: NI 모듈 점검 결과 Ok
    type: regex
    command: show log swlog | grep -i "NI Module Status"
    pattern: 'NI Module Status\s*-+>\s*(?i:ok)'
    timeout: 90
    reauth: true
cleanup: []
continue_on_failure: false
timeout: 120
