name: secfunc_lockout
description: >-
  계정 잠금(1.3.3) 및 IP 차단(1.3.4) 실동작 시험 - 반드시 --device secureadmin 으로 실행.
  admin1으로 접속 실패시키고 secureadmin 세션에서 확인하므로, admin1 계정(ACSSW01)으로 돌리면
  자기 자신을 잠그는 모순이 됨. secureadmin 장비 엔트리는 시리얼 콘솔(transport: serial)로 붙으므로
  실행 전 configs/devices.yaml 의 serial_port 값이 실제 콘솔 케이블 COM 포트와 맞는지 확인할 것.
  IP 차단 시험은 이 장비의 IP를 실제로 차단시키므로 반드시 마지막에 두고, cleanup 미실행 시
  콘솔에서 aaa switch-access banned-ip all release 로 해제할 것.
tests:
  - ../testcases/secfunc/check_lockout_enforcement_ssh.yaml
  - ../testcases/secfunc/check_ip_ban_enforcement_ssh.yaml
