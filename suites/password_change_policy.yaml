name: password_change_policy
description: >-
  비밀번호 변경 정책 강제 시험(TC-IA-123) 단독 suite. 같은 YAML을 전송만 바꿔 돌리도록
  통합 러너(run_secfunc.py)의 password-change 단계가 이 suite를 콘솔·SSH 양쪽으로 실행함:

    switchtest run --device secureadmin --suite suites/password_change_policy.yaml   # 콘솔
    switchtest run --device admin       --suite suites/password_change_policy.yaml   # SSH

  API/WebView 전송은 같은 정책을 omniswitch_api_poc 의
  test_password_policy.py / test_password_policy_webview.py 가 검증함. 네 전송을
  순서대로(콘솔->SSH->API->WebView) 하나씩 돌리는 이유는 모두 같은 계정의 비밀번호
  변경을 건드리므로 동시 실행 시 서로 간섭하기 때문.

  이 시험이 쓰는 비밀번호는 전부 정책 위반값이라 실제로 바뀌는 비밀번호는 없음(임시 계정
  tcpol 을 만들어 시도하고 지움). 이력 규칙만 단독으로 보는 성공 케이스는 TC-IA-124 에 있음.
tests:
  - ../testcases/secfunc/check_password_policy_enforcement_change.yaml
