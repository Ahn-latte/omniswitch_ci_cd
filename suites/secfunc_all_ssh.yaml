name: secfunc_all_ssh
description: >-
  SSH로 붙는 admin 계정 하나로 돌릴 수 있는 secfunc 항목 전부(17개). 통합 실행
  (scripts/run_secfunc.py)의 switch-ssh 단계이며, 단독으로도 돌릴 수 있음:

    switchtest run --device admin --suite suites/secfunc_all_ssh.yaml

  여기 있는 시험은 네트워크를 끊거나 이 PC의 IP를 차단하지 않음 - 그런 시험은
  콘솔이 필요하므로 secfunc_console.yaml 에 따로 있음. 저권한 계정으로 로그인해야
  하는 감사 접근 제한 시험도 별도(secfunc_lowpriv.yaml).

  `show log swlog` 를 읽는 시험도 여기 없음. 그 명령은 secureadmin 전용이라 admin
  계정으로는 세션이 끊길 뿐이고, 감사 증거로 swlog가 필요한 시험(TC-FC-311,
  TC-ST-511/512/521/523, TC-AU-811/821/831)은 secfunc_console.yaml 로 옮겼음.
  주의: "admin 계정에서 swlog가 안 보인다"를 증명하는 시험이 아님 - 그 목적의
  시험은 TC-AU-841(secfunc_lowpriv.yaml)이고, 저 여덟 개는 반대로 swlog를 읽어야
  성립하는 시험이라 읽을 수 있는 계정으로 옮긴 것.

  순서는 도메인별 묶음일 뿐 의존성은 없음. 각 시험이 자기가 바꾼 설정을 스스로
  되돌리며(cleanup), 되돌리는 기준값은 전부 lab.yaml 의 baseline 임.
tests:
  # 1.x 식별/인증
  - ../testcases/secfunc/check_password_policy.yaml
  - ../testcases/secfunc/check_password_policy_enforcement_create.yaml
  # 비밀번호 변경 정책(TC-IA-123)은 네 전송을 순서대로 도는 password-change 단계
  # (suites/password_change_policy.yaml)에서 다루므로 여기서는 뺌.
  - ../testcases/secfunc/check_lockout_threshold.yaml
  - ../testcases/secfunc/check_lockout_duration.yaml
  - ../testcases/secfunc/check_weak_algo_blocked.yaml
  # 3.x 흐름 제어
  # TC-FC-311(check_acl_policy)은 정책 설정이 swlog에 기록됐는지까지 보므로 콘솔로 감.
  - ../testcases/secfunc/check_vlan_tagging.yaml
  # 4.x 보안 관리
  - ../testcases/secfunc/check_ip_service.yaml
  - ../testcases/secfunc/check_firmware_version.yaml
  - ../testcases/secfunc/check_image_hash.yaml
  - ../testcases/secfunc/check_session_timeout.yaml
  # 5.x 자체시험
  # 요청 시 자체시험(TC-ST-513)만 여기 남음 - 부팅 시 검사 결과는 swlog로만 확인
  # 가능해서 TC-ST-511/512/521/523은 콘솔로 감.
  - ../testcases/secfunc/check_self_test.yaml
  # 7.x 데이터 보호
  - ../testcases/secfunc/check_remote_crypto.yaml
  - ../testcases/secfunc/check_syslog_tls.yaml
  - ../testcases/secfunc/check_tls_version.yaml
  - ../testcases/secfunc/check_ssh_version.yaml
  - ../testcases/secfunc/check_webview_tls_version.yaml
  # 8.x 감사
  # 외부 로그서버 설정(TC-AU-842)은 `show swlog` 설정 출력만 보므로 여기 남음.
  # swlog 본문을 읽어야 하는 TC-AU-811/821/831은 콘솔로 감.
  - ../testcases/secfunc/check_swlog_export.yaml
